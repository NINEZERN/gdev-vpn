name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsodium-dev libncurses-dev valgrind

      - name: Compile project
        run: make

      - name: Run unit tests
        run: make test

      - name: Check memory leaks
        run: make memcheck
